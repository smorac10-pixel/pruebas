
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Eagle</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
   <nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center gap-3" href="#">

            <img src="img/LOGO.png" width="90" height="90" alt="Logo">

            <span class="fw-bold fs-3">
                GEAR EAGLE
            </span>

        </a>

    </div>
</nav>

    <div class="container mt-5">

        <!-- PRODUCTOS -->
        <div class="card shadow mb-5">

            <div class="card-header bg-primary text-white d-flex justify-content-between">
                <h3>Gestión de Productos</h3>

                <button
    class="btn btn-light"
    data-bs-toggle="modal"
    data-bs-target="#modalProducto">

    + Nuevo Producto

</button>

            </div>

            <div class="card-body">

                <table class="table table-striped">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <td>1</td>
                            <td>Aceite Motul</td>
                            <td>$55.000</td>
                            <td>20</td>
                            <td>

                                <button class="btn btn-warning btn-sm">
                                    Editar
                                </button>

                                <button class="btn btn-danger btn-sm">
                                    Eliminar
                                </button>

                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- SERVICIOS -->

        <div class="card shadow">

            <div class="card-header bg-success text-white d-flex justify-content-between">

                <h3>Gestión de Servicios</h3>

                <button
    class="btn btn-light"
    data-bs-toggle="modal"
    data-bs-target="#modalServicio">

    + Nuevo Servicio

</button>
<!-- Modal Nuevo Servicio -->
<div class="modal fade" id="modalServicio">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-success text-white">

                <h5 class="modal-title">
                    Nuevo Servicio
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        Nombre del servicio
                    </label>

                    <input
                        type="text"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Descripción
                    </label>

                    <textarea
                        class="form-control">
                    </textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Precio base
                    </label>

                    <input
                        type="number"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Duración estimada
                    </label>

                    <input
                        type="text"
                        class="form-control">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button class="btn btn-success">

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>

            </div>

            <div class="card-body">

                <table class="table table-striped">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Duración</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <td>1</td>
                            <td>Cambio de aceite</td>
                            <td>Mantenimiento básico</td>
                            <td>$35.000</td>
                            <td>30 min</td>

                            <td>

                                <button class="btn btn-warning btn-sm">
                                    Editar
                                </button>

                                <button class="btn btn-danger btn-sm">
                                    Eliminar
                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Modal Nuevo Producto -->
<div class="modal fade" id="modalProducto">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-primary text-white">

                <h5 class="modal-title">
                    Nuevo Producto
                </h5>

                <button
    type="button"
    class="btn-close"
    data-bs-dismiss="modal">
</button>

            </div>


            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        class="form-control">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Precio
                    </label>

                    <input
                        type="number"
                        class="form-control">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Stock
                    </label>

                    <input
                        type="number"
                        class="form-control">

                </div>

            </div>


            <div class="modal-footer">

                <button class="btn btn-secondary">
                    Cancelar
                </button>

                <button class="btn btn-primary">
                    Guardar
                </button>

            </div>

        </div>

    </div>

</div>
</body>

</html>
